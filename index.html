<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Путешествие по России</title>
    <link rel="stylesheet" href="./styles/normalize.css">
    <link rel="stylesheet" href="./styles/fonts.css">
    <link rel="stylesheet" href="./styles/style.css">


</head>

<body>
    <div class="pages">
        <section class="header">
            <img src="./images/russia.svg" alt="russia_logo" class="header__logo">
            <div class="header__link_lang">
                <a href="#" class="header__link_lang_ru">Ru</a>
                <a href="#" class="header__link_lang_ru">En</a>
        </section>

        <section class="lead">
            <div class="lead__container">
                <h1 class="title lead__title">Путешествия по России</h1>
                <h2 class="subtitle lead__subtitle">Настоящая страна не в выпусках новостей, а здесь.</h2>
                <img src="./images/train.svg" alt="Здесь должна быть картинку купэ" class="lead__image">
                <p class="lead__image-subline">ваша полка — верхняя</p>
            </div>
        </section>

        <section class="intro">
            <h2 class="title intro__title"></h2>
            <p class="intro__main"></p>
            <p class="intro__info"><span class="span"></span></p>
            <p class="intro__info"><span class="span"></span></p>
            <p class="intro__info"><span class="span"></span></p>
            <p class="intro__info"><span class="span"></span></p>
            <p class="intro__info"><span class="span"></span></p>
        </section>

        <section class="gallery">
            <img src="" alt="" class="gallery__image">
            <img src="" alt="" class="gallery__image">
            <img src="" alt="" class="gallery__image">
            <img src="" alt="" class="gallery__image">
            <img src="" alt="" class="gallery__image">
            <img src="" alt="" class="gallery__image">
            <img src="" alt="" class="gallery__image">
            <img src="" alt="" class="gallery__image">
            <img src="" alt="" class="gallery__image">
            <img src="" alt="" class="gallery__image">
            <img src="" alt="" class="gallery__image">
            <img src="" alt="" class="gallery__image">
        </section>

        <section class="places">
            <div class="title places__title"></div>
            <img src="" alt="" class="places__image">
            <div class="places__url">
                <p class="places__url_type_top"></p>
                <p class="places__url_type_bottom"></p>
            </div>
            <p class="places__desription"></p>
            <p class="places__desription"></p>

        </section>

        <section class="cover">
            <h1 class="title cover__title"></h1>
            <p class="cover__subtitle"></p>
        </section>

        <section class="footer">
            <nav class="footer__nav"></nav>
            <div class="footer__author"></div>
        </section>
    </div>
</body>

</html>
