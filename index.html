                    целая
                    вселенная с ласковым морем юга, густыми лесами Саян и суровыми льдами плато Путорана. А ещё увидеть

        <section class="places">
            <div class="places__container">
                <div class="places__card">
                    <div class="places__card_column">
                        <div class="title places__card_title">Куршская коса</div>
                        <img src="./images/kosa.png" alt="Куршская коса" class="places__card_image">
                    </div>
                    <div class="places__card_column">
                        <div class="places__card_url">
                            <p class="places__card_url_top">URL</p>
                            <a href="http://park-kosa.ru" class="places__card_url_bottom">park-kosa.ru</a>
                        </div>
                        <div class="places__card_desription">
                            <p class="places__card_desription_text">Здесь, посреди лесов и песчаных дюн, вы сможете
                                увидеть два
                                водных горизонта — спокойного Куршского залива с одной стороны и подёрнутого рябью волн
                                Балтийского моря с другой. Уникальная природная зона на краю российского анклава.</p>
                            <p class="places__card_desription_text">На этом Калининградская область не заканчивается.
                                Для
                                путешественника и исследователя там же по соседству — самая западная точка России,
                                Балтийская коса, — и немецкое наследие россыпи небольших приморских городов. Атмосфера
                                здешних мест исключает суету, окуная в спокойствие природы и запах стального,
                                прохладного
                                моря.</p>
                        </div>
                    </div>
                </div>
                <div class="places__card">
                    <div class="places__card_column">
                        <div class="title places__card_title">Кольский</div>
                        <img src="./images/kolskiy.png" alt="Кольский" class="places__card_image">
                    </div>
                    <div class="places__card_column">
                        <div class="places__card_url">
                            <p class="places__card_url_top">URL</p>
                            <a href="https://yourshot.nationalgeographic.com/photos/?keywords=kolskiy"
                                class="places__card_url_bottom">National Geographic</a>
                        </div>
                        <div class="places__card_desription">
                            <p class="places__card_desription_text">Почти весь полуостров находится за Полярным кругом.
                                Саамская тундра, от которой на юг —
                                тайга, а на север — Ледовитый океан, прикидывающийся Баренцевым морем.</p>
                            <p class="places__card_desription_text">Возможно, вы смотрели Звягинцева и даже слышали
                                историю арктического фестиваля в Териберке. Возможно, слово «Хибины» не осталось под
                                снегом школьных воспоминаний об уроках географии. Возможно, вы не интересовались
                                пронизывающей земную кору сверхглубокой скважиной, а от апатитов вас давно накрывает
                                апатия. Но ваша мечта увидеть северное сияние начинает сбываться с билетом
                                в Мурманск.</p>
                        </div>
                    </div>
                </div>
                <div class="places__card">
                    <div class="places__card_column">
                        <div class="title places__card_title">Алтай</div>
                        <img src="./images/altay.png" alt="Алтай" class="places__card_image">
                    </div>
                    <div class="places__card_column">
                        <div class="places__card_url">
                            <p class="places__card_url_top">URL</p>
                            <a href="https://www.youtube.com/watch?v=7ZEsoV7kWAQ"
                                class="places__card_url_bottom">Youtube</a>
                        </div>
                        <div class="places__card_desription">
                            <p class="places__card_desription_text">Алтай — одно из красивейших мест в России.
                                В первую очередь из-за гор: если ехать вдоль хребта, вы увидите склоны, усыпанные
                                соснами, горные реки и озёра. А если вы откроете в автомобиле окна, сможете
                                познакомиться с невидимым чудом здешних мест — горным воздухом.</p>
                            <p class="places__card_desription_text">Климат на Алтае умеренный, поэтому ехать сюда лучше
                                всего летом. Так вы увидите всё разнообразие местной флоры и фауны. По лесам Алтая
                                бродят лоси, над хребтами летают орлы, а на равнинах пасутся косули. И знаменитые манулы
                                — тоже обитатели Алтайского края.</p>
                        </div>
                    </div>
                </div>
                <div class="places__card">
                    <div class="places__card_column">
                        <div class="title places__card_title">Зимний Байкал</div>
                        <img src="./images/baykal.png" alt="Зимний Байкал" class="places__card_image">
                    </div>
                    <div class="places__card_column">
                        <div class="places__card_url">
                            <p class="places__card_url_top">URL</p>
                            <a href="https://vk.com/baikalmile"
                                class="places__card_url_bottom">https://vk.com/baikalmile</a>
                        </div>
                        <div class="places__card_desription">
                            <p class="places__card_desription_text">Всем известен Байкал как крупнейшее озеро
                                в мире. Многие также знают, что это самый большой источник пресной воды и одно из
                                красивейших мест в России.</p>
                            <p class="places__card_desription_text">Конечно, это всё так. Но Байкал ещё идеальное место
                                для соревнований по скийорингу. Это такой вид спорта, когда лыжник привязывает себя
                                к мотоциклу, и тандем старается развить как можно бóльшую скорость на льду. В марте 2019
                                года на фестивале «Байкальская миля» был поставлен мировой рекорд — 197.011 км/ч.</p>
                        </div>
                    </div>
                </div>
                <div class="places__card">
                    <div class="places__card_column">
                        <div class="title places__card_title">Карелия</div>
                        <img src="./images/karelia.png" alt="Карелия" class="places__card_image">
                    </div>
                    <div class="places__card_column">
                        <div class="places__card_url">
                            <p class="places__card_url_top">URL</p>
                            <a href="http://vodlozero.ru" class="places__card_url_bottom">http://vodlozero.ru/</a>
                        </div>
                        <div class="places__card_desription">
                            <p class="places__card_desription_text">Сибирь заканчивается не на Урале, а в Карелии:
                                образующая тайгу сибирская лиственница не растёт западнее Водлозера. Зато здесь она
                                вымахивает на 30 метров — леса карельских национальных парков из-за непроходимых болот
                                никогда не знали топора. Некоторым соснам уже больше чем полтысячелетия. Прикоснитесь к
                                живому существу, видевшему солнце раньше, чем увидал его Иван Грозный.
                                В девственном лесу на сотню километров не встретишь тропы. А на редких тропинках деревья
                                в паре метров от земли помечены медвежьими когтями. Чтобы все знали, кто тут хозяин.</p>
                        </div>
                    </div>
                </div>
            </div>
